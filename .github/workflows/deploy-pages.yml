# Pubblica il sito statico su GitHub Pages.
# Si avvia a ogni push su main, a mano, oppure richiamato da update-events.yml.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkout della punta del branch (non dello SHA iniziale), così include
      # il commit dei dati appena fatto da update-events.yml.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Pubblichiamo solo i file del sito (niente script, cache o test).
      - name: Prepara la cartella del sito
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r src _site/
          cp data/events.json data/artists.json _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
